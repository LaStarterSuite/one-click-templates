[Unit]
# First boot writes the secrets; until then Grafana stays stopped instead of starting with defaults.
ConditionPathExists=/etc/grafana/one-click/secret_key

[Service]
# Grafana sets the admin password only when it creates its database, on its first start.
Environment=GF_SECURITY_ADMIN_USER=admin
Environment=GF_SECURITY_ADMIN_PASSWORD__FILE=/etc/grafana/one-click/admin_password
Environment=GF_SECURITY_SECRET_KEY__FILE=/etc/grafana/one-click/secret_key
# First boot writes GF_SERVER_ROOT_URL here when Central routes a site name to the server.
EnvironmentFile=-/etc/grafana/one-click/grafana.env
