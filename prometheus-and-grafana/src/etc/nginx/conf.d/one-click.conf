# The regional proxy ends HTTPS and forwards the server's site name here, on port 80.
map $http_upgrade $connection_upgrade {
	default upgrade;
	"" close;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	# Behind the proxy the browser speaks HTTPS, so a redirect keeps its own scheme and host.
	absolute_redirect off;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

	# Prometheus serves every path under /prometheus, so the path passes through unchanged.
	location = /prometheus {
		return 301 /prometheus/;
	}
	location /prometheus/ {
		auth_basic "Prometheus";
		auth_basic_user_file /etc/nginx/one-click/prometheus.htpasswd;
		proxy_pass http://127.0.0.1:9090;
	}

	# Other servers push their metrics with the push password, which opens nothing else.
	location = /prometheus/api/v1/write {
		auth_basic "Prometheus push";
		auth_basic_user_file /etc/nginx/one-click/push.htpasswd;
		proxy_pass http://127.0.0.1:9090;
	}

	# The install script for other servers; it holds no secret.
	location = /connect.sh {
		root /var/www/one-click;
		default_type text/plain;
	}

	# Grafana Live keeps a WebSocket open.
	location / {
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://127.0.0.1:3000;
	}
}
